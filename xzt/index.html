<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>写字台</title>
    <style>
        /* 重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            color: white;
            font-family: 'DeDaoJinKai', 'HarmonyOS Sans SC', sans-serif;
            display: flex;
            flex-direction: row;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100%;
            background-color: #2a2a2a;
            border-right: 1px solid #555;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 5;
        }

        #sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        #sidebar-header h3 {
            font-size: 16px;
            font-weight: normal;
            color: #ccc;
        }

        #newDocBtn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        #newDocBtn:hover {
            color: #8cf;
        }

        #doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid #3a3a3a;
            transition: background 0.15s;
        }

        .doc-item:hover {
            background-color: #3a3a3a;
        }

        .doc-item.active {
            background-color: #4a4a4a;
            border-left: 3px solid #8cf;
        }

        .doc-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            color: #ddd;
        }

        .doc-item.active .doc-title {
            color: #fff;
        }

        .doc-delete {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            line-height: 1;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .doc-delete:hover {
            color: #f66;
        }

        #main {
            flex: 1;
            margin-left: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .button-container {
            position: relative;
            top: 0;
            left: 0;
            transform: none;
            width: 100%;
            max-width: 60ch;
            min-width: 60ch;
            text-align: center;
            z-index: 10;
            padding: 10px 0 6px 0;
            background-color: transparent;
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .button-container button {
            display: inline-block;
            padding: 8px 15px;
            cursor: pointer;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background-color 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .button-container button:hover {
            background-color: #555;
        }

        #mobileDocBtn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0 6px;
        }

        #editor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-width: 60ch;
            min-width: 60ch;
            height: 100%;
            padding-bottom: 20px;
            flex: 1;
            margin-top: 0;
            position: relative;

        }

        #read {
            font-family: 'HarmonyOS Sans SC', sans-serif;
            font-size: 12px;
            color: rgba(250, 235, 215, 0.406);
            margin-top: 6px;
            margin-bottom: 5px;
            width: 100%;
            text-align: left;
            user-select: none;
            padding-left: 0;
            flex-shrink: 0;
        }

        #cbzButton {
            display: none;
        }

        /* 编辑器改为 contenteditable div */
        #editor {
            width: 100%;
            height: 100%;
            padding: 20px;
            border: 1px solid white;
            background-color: #333;
            color: white;
            text-align: left;
            box-sizing: border-box;
            overflow-y: auto;
            font-family: 'DeDaoJinKai', 'HarmonyOS Sans SC', sans-serif;
            font-size: 22px;
            outline: none;
            line-height: 1.6em;
            flex: 1;
            white-space: pre-wrap;
            /* 保留换行 */
            word-wrap: break-word;
            margin-bottom: 60px;
        }

        #editor a {
            color: #8cf;
            text-decoration: underline;
            cursor: pointer;
        }

        #editor a:hover {
            color: #adf;
        }

        #editor::-webkit-scrollbar {
            width: 8px;
        }

        #editor::-webkit-scrollbar-track {
            background-color: #333;
        }

        #editor::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 10px;
        }

        #mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        #mobile-overlay.show {
            display: flex;
        }

        #mobile-drawer {
            width: 100%;
            max-height: 80%;
            background: #2a2a2a;
            border-radius: 16px 16px 0 0;
            padding: 16px 0 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        #mobile-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px 12px 16px;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        #mobile-drawer-header h3 {
            font-size: 16px;
            font-weight: normal;
            color: #ccc;
        }

        #mobileNewDocBtn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
        }

        #mobileNewDocBtn:hover {
            color: #8cf;
        }

        #mobileDrawerClose {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
        }

        #mobile-doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .mobile-doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #3a3a3a;
        }

        .mobile-doc-item.active {
            background-color: #4a4a4a;
        }

        .mobile-doc-item .doc-title {
            font-size: 15px;
            color: #ddd;
        }

        .mobile-doc-item .doc-delete {
            color: #888;
        }

        .mobile-doc-item .doc-delete:hover {
            color: #f66;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100%;
                overflow: hidden;
            }

            #sidebar {
                display: none;
            }

            #main {
                margin-left: 0;
                flex: 1;
                height: 100%;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            #mobileDocBtn {
                display: inline-block;
                background-color: #444;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 12px;
                padding: 6px 12px;
                cursor: pointer;
                flex-shrink: 0;
            }

            .button-container {
                position: relative;
                bottom: auto;
                left: auto;
                right: auto;
                top: auto;
                width: 92%;
                max-width: none;
                min-width: 0;
                padding: 6px 0;
                gap: 8px;
                flex-wrap: nowrap;
                justify-content: center;
                margin: 0 auto;
                background-color: #333;
                box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2);
                z-index: 10;
                flex-shrink: 0;
                height: 48px;
                overflow-x: auto;
                overflow-y: hidden;
                order: 2;
            }

            .button-container::-webkit-scrollbar {
                display: none;
            }

            .button-container button {
                padding: 6px 12px;
                font-size: 12px;
                margin: 0;
                flex-shrink: 0;
            }

            .button-container button[data-mobile] {
                font-size: 0;
            }

            .button-container button[data-mobile]::before {
                content: attr(data-mobile);
                font-size: 12px;
            }

            #editor-container {
                width: 92%;
                max-width: none;
                min-width: 0;
                flex: 1;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                height: auto;
                padding-bottom: 0;
                order: 1;
                overflow: hidden;
            }

            #editor {
                width: 100%;
                height: auto;
                font-size: 16px;
                padding: 12px;
                flex: 1;
                min-height: 0;
                margin-bottom: 6px;
            }

            #read {
                text-align: left;
                margin-left: 0;
                font-size: 11px;
                margin-top: 6px;
                width: 100%;
            }

            #cbzButton {
                display: none;
            }

            #archiveButton {
                display: none;
            }

            #newDocBtn {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .button-container button {
                padding: 5px 10px;
                font-size: 11px;
                margin: 2px 2px;
            }

            #editor {
                font-size: 15px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h3>✏️ 写字台</h3>
            <button id="newDocBtn" title="新建文档">+</button>
        </div>
        <div id="doc-list"></div>
    </div>

    <div id="main">
        <div class="button-container">
            <button id="mobileDocBtn" title="文档列表">+</button>
            <button id="scrollTopButton" data-mobile="⬆️">置顶</button>
            <button id="cleanMarkdown" data-mobile="🎉">排版</button>
            <button id="xh" data-mobile="序">序号</button>
            <button id="numBigButton" data-mobile="A">字体</button>
            <button id="copyButton" data-mobile="C">复制</button>
            <button id="clearButton" data-mobile="空">清空</button>
            <button id="cbzButton">错别字</button>
            <button id="archiveButton">归档</button>
        </div>

        <div id="editor-container">
            <div id="read">全文 0 字 预计 0 分钟</div>
            <div id="editor" contenteditable="true" autofocus></div>
        </div>
    </div>

    <div id="mobile-overlay">
        <div id="mobile-drawer">
            <div id="mobile-drawer-header">
                <h3>✏️ 写字台</h3>
                <div>
                    <button id="mobileNewDocBtn" title="新建文档">+</button>
                    <button id="mobileDrawerClose" title="关闭">✕</button>
                </div>
            </div>
            <div id="mobile-doc-list"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
