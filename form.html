<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>信息处理对话平台 · 智能结构化助手</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px 16px;
            color: #1e2a3e;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.02);
            padding: 20px 24px 28px;
            margin-bottom: 24px;
            transition: all 0.2s;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 18px;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 12px;
        }
        .card-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1f4870, #2a6f8f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .badge {
            background: #eef2fa;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1f4870;
        }
        textarea {
            width: 100%;
            padding: 16px 18px;
            font-size: 0.95rem;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            border: 1px solid #cfdfed;
            border-radius: 20px;
            background: #fefefe;
            resize: vertical;
            transition: 0.2s;
            line-height: 1.5;
            color: #1a2c3e;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0 8px;
        }
        button {
            background: #ffffff;
            border: 1px solid #cbdde9;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1f4870;
            background: #f9fbfd;
        }
        button.primary {
            background: #1f4870;
            border-color: #1f4870;
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        button.primary:hover {
            background: #0f3557;
            transform: translateY(-1px);
        }
        button:hover {
            background: #eef3fc;
            border-color: #8fbbdf;
        }
        .result-area {
            margin-top: 20px;
            border-radius: 20px;
            background: #f8fafc;
            border: 1px solid #e2edf7;
            overflow: hidden;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #f1f5f9;
            border-bottom: 1px solid #e0ecf5;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c5a7a;
        }
        .copy-btn {
            background: none;
            border: none;
            padding: 4px 12px;
            font-size: 0.75rem;
            background: #ffffffd9;
            border-radius: 40px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .copy-btn:active {
            background: #e6f0fa;
        }
        .output-content {
            padding: 20px;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            color: #1e2f3f;
            background: #ffffff;
            min-height: 180px;
            max-height: 500px;
            overflow-y: auto;
        }
        .empty-hint {
            color: #90a4bc;
            font-style: normal;
            text-align: center;
            padding: 28px 12px;
        }
        .info-note {
            background: #eef6fe;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.8rem;
            color: #2c6280;
            margin-top: 16px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #8aa0b0;
            margin-top: 16px;
        }
        @media (max-width: 600px) {
            .card {
                padding: 16px;
            }
            .output-content {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>📋 信息处理对话平台</h2>
            <div class="badge">智能类型识别 · 可扩展</div>
        </div>
        <div style="margin-bottom: 12px; font-size: 0.85rem; color: #3e6a8c;">
            ✨ 自动识别文本类型，输出结构化纯文本。支持批量处理多条记录。
        </div>
        <textarea id="rawInput" rows="8" placeholder="请输入续保提醒通知"></textarea>
        
        <div class="btn-group">
            <button class="primary" id="processBtn">🔁 智能结构化处理</button>
            <button id="clearBtn">🗑️ 清空</button>
        </div>
        
        <div class="info-note">
            💡 当前支持的类型：<strong>续保提醒</strong>（规则：包含“投保的...保单号...被保人...到期...重新投保”）<br>
            🚧 扩展说明：后续可添加会议提醒、理赔通知等解析规则，平台将自动识别并应用对应模板。
        </div>
    </div>

    <div class="card">
        <div class="result-header">
            <span>📄 结构化结果（纯文本 · 可直接复制）</span>
            <button class="copy-btn" id="copyResultBtn">📋 复制全部</button>
        </div>
        <div class="output-content" id="outputArea">
            <div class="empty-hint">✨ 等待处理… 粘贴文本后点击“智能结构化处理”</div>
        </div>
    </div>
    <footer>
        基于规则识别类型 · 可轻松扩展新解析器 | 无任何真实个人信息
    </footer>
</div>

<script>
    (function() {
        // 续保提醒解析器
        const RenewalParser = {
            typeName: '续保提醒',
            match: (text) => {
                return /投保的.+（保单号：.+，被保人：.+）将于\d{4}-\d{2}-\d{2}到期.*重新投保/.test(text);
            },
            parse: (fullText) => {
                const pattern = /您的客户([\u4e00-\u9fa5]+)投保的([\s\S]+?)（保单号：([^，]+?)，被保人：([\u4e00-\u9fa5]+)）将于(\d{4}-\d{2}-\d{2})到期，请及时提醒客户通过以下链接重新投保：(https?:\/\/[^\s]+)/g;
                const results = [];
                let match;
                while ((match = pattern.exec(fullText)) !== null) {
                    const policyHolder = match[1].trim();
                    let productName = match[2].trim().replace(/\s+/g, ' ');
                    const policyNo = match[3].trim();
                    const insured = match[4].trim();
                    const expireDate = match[5];
                    let renewalLink = match[6].trim().replace(/[。，,、\s]+$/, '');
                    results.push({ policyHolder, productName, policyNo, insured, expireDate, renewalLink });
                }
                if (results.length === 0) return [];
                return results.map(r => {
                    return `【续保提醒】${r.insured} | 到期 ${r.expireDate}\n产品名称：${r.productName}\n投保人：${r.policyHolder}；被保人：${r.insured}；保单号：${r.policyNo}\n续保链接：${r.renewalLink}\n备注：请及时提醒客户重新投保，如已投保请忽略`;
                });
            }
        };
        
        const parsers = [RenewalParser];
        
        function processUniversal(rawText) {
            if (!rawText || rawText.trim() === '') {
                return { success: false, output: '' };
            }
            const allBlocks = [];
            for (const parser of parsers) {
                if (parser.match && parser.match(rawText)) {
                    const parsedItems = parser.parse(rawText);
                    if (parsedItems && parsedItems.length) {
                        allBlocks.push(...parsedItems);
                    }
                }
            }
            if (allBlocks.length === 0) {
                return { success: false, output: '' };
            }
            const unique = [...new Map(allBlocks.map(block => [block, block])).values()];
            return { success: true, output: unique.join('\n\n') };
        }
        
        const textarea = document.getElementById('rawInput');
        const processBtn = document.getElementById('processBtn');
        const clearBtn = document.getElementById('clearBtn');
        const outputDiv = document.getElementById('outputArea');
        const copyBtn = document.getElementById('copyResultBtn');
        
        function updateOutput(content) {
            if (!content) {
                outputDiv.innerHTML = `<div class="empty-hint">⚠️ 未能识别到任何支持的消息类型。<br>请确保文本格式符合续保提醒规则。<br>后续将扩展会议提醒等更多类型。</div>`;
                return;
            }
            outputDiv.innerHTML = `<div style="white-space: pre-wrap; font-family: inherit;">${escapeHtml(content)}</div>`;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function handleProcess() {
            const raw = textarea.value;
            if (!raw.trim()) {
                outputDiv.innerHTML = `<div class="empty-hint">📭 输入框为空，请粘贴续保提醒文本</div>`;
                return;
            }
            const result = processUniversal(raw);
            if (!result.success || !result.output) {
                updateOutput('');
                return;
            }
            updateOutput(result.output);
        }
        
        function clearAll() {
            textarea.value = '';
            outputDiv.innerHTML = `<div class="empty-hint">✨ 已清空，粘贴续保提醒文本后点击处理</div>`;
        }
        
        function copyResult() {
            let textToCopy = '';
            const outputContentDiv = outputDiv.querySelector('div');
            if (outputContentDiv && !outputDiv.querySelector('.empty-hint')) {
                textToCopy = outputContentDiv.innerText || outputContentDiv.textContent;
            } else {
                const hintDiv = outputDiv.querySelector('.empty-hint');
                if (hintDiv) {
                    textToCopy = '暂无有效结构化内容，请先处理文本。';
                } else {
                    textToCopy = outputDiv.innerText || '';
                }
            }
            if (!textToCopy || textToCopy.includes('未能识别到任何支持的消息类型')) {
                if (confirm('当前没有有效的结构化结果，是否仍要复制提示信息？')) {
                    textToCopy = outputDiv.innerText;
                } else {
                    return;
                }
            }
            navigator.clipboard.writeText(textToCopy).then(() => {
                const original = copyBtn.innerText;
                copyBtn.innerText = '✅ 已复制！';
                setTimeout(() => {
                    copyBtn.innerText = original;
                }, 1500);
            }).catch(() => alert('复制失败，可手动选择复制'));
        }
        
        processBtn.addEventListener('click', handleProcess);
        clearBtn.addEventListener('click', clearAll);
        copyBtn.addEventListener('click', copyResult);
        
        textarea.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                handleProcess();
            }
        });
    })();
</script>
</body>
</html>
