<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>信息处理对话平台 · 智能结构化助手</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px 16px;
            color: #1e2a3e;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.02);
            padding: 20px 24px 28px;
            margin-bottom: 24px;
            transition: all 0.2s;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 18px;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 12px;
        }
        .card-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1f4870, #2a6f8f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .badge {
            background: #eef2fa;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1f4870;
        }
        textarea {
            width: 100%;
            padding: 16px 18px;
            font-size: 0.95rem;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            border: 1px solid #cfdfed;
            border-radius: 20px;
            background: #fefefe;
            resize: vertical;
            transition: 0.2s;
            line-height: 1.5;
            color: #1a2c3e;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0 8px;
        }
        button {
            background: #ffffff;
            border: 1px solid #cbdde9;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1f4870;
            background: #f9fbfd;
        }
        button.primary {
            background: #1f4870;
            border-color: #1f4870;
            color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        button.primary:hover {
            background: #0f3557;
            transform: translateY(-1px);
        }
        button:hover {
            background: #eef3fc;
            border-color: #8fbbdf;
        }
        .result-area {
            margin-top: 20px;
            border-radius: 20px;
            background: #f8fafc;
            border: 1px solid #e2edf7;
            overflow: hidden;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #f1f5f9;
            border-bottom: 1px solid #e0ecf5;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c5a7a;
        }
        .copy-btn {
            background: none;
            border: none;
            padding: 4px 12px;
            font-size: 0.75rem;
            background: #ffffffd9;
            border-radius: 40px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            cursor: pointer;
        }
        .copy-btn:active {
            background: #e6f0fa;
        }
        .output-content {
            padding: 20px;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            color: #1e2f3f;
            background: #ffffff;
            min-height: 180px;
            max-height: 500px;
            overflow-y: auto;
        }
        .empty-hint {
            color: #90a4bc;
            font-style: normal;
            text-align: center;
            padding: 28px 12px;
        }
        .info-note {
            background: #eef6fe;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.8rem;
            color: #2c6280;
            margin-top: 16px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #8aa0b0;
            margin-top: 16px;
            padding: 12px;
            border-top: 1px solid #e9eef3;
        }
        .update-time {
            font-size: 0.7rem;
            color: #8aa0b0;
            text-align: center;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }
        @media (max-width: 600px) {
            .card {
                padding: 16px;
            }
            .output-content {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>📋 信息处理对话平台</h2>
            <div class="badge">智能类型识别 · 可扩展</div>
        </div>
        <div style="margin-bottom: 12px; font-size: 0.85rem; color: #3e6a8c;">
            ✨ 自动识别文本类型，输出结构化纯文本。支持批量处理多条记录。
        </div>
        <textarea id="rawInput" rows="8" placeholder="请输入续保提醒通知"></textarea>
        
        <div class="btn-group">
            <button class="primary" id="processBtn">🔁 智能结构化处理</button>
            <button id="clearBtn">🗑️ 清空</button>
        </div>
        
        <div class="info-note">
            💡 当前支持的类型：<strong>续保提醒</strong>（规则：包含“投保的...保单号...被保人...到期...重新投保”）<br>
            🚧 扩展说明：后续可添加会议提醒、理赔通知等解析规则。
        </div>
    </div>

    <div class="card">
        <div class="result-header">
            <span>📄 结构化结果（纯文本 · 可直接复制）</span>
            <button class="copy-btn" id="copyResultBtn">📋 复制全部</button>
        </div>
        <div class="output-content" id="outputArea">
            <div class="empty-hint">✨ 等待处理… 粘贴文本后点击“智能结构化处理”</div>
        </div>
    </div>
    <footer>
        基于规则识别类型 · 可扩展架构
        <div class="update-time" id="updateTimeDisplay"></div>
    </footer>
</div>

<script>
    (function() {
        // 更新底部时间显示（精确到秒）
        function updateFooterTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const timeStr = `${year}年${month}月${day}日 ${hours}:${minutes}:${seconds}`;
            const timeDisplay = document.getElementById('updateTimeDisplay');
            if (timeDisplay) {
                timeDisplay.innerText = `⏱️ 更新时间：${timeStr}`;
            }
        }
        
        updateFooterTime();
        setInterval(updateFooterTime, 1000);
        
        // 从产品名称中提取产品类型
        function extractProductType(fullProductName) {
            if (/医疗险/.test(fullProductName)) {
                return "医疗险";
            }
            if (/重疾险/.test(fullProductName)) {
                return "重疾险";
            }
            if (/意外险/.test(fullProductName)) {
                return "意外险";
            }
            if (/寿险/.test(fullProductName)) {
                return "寿险";
            }
            if (/年金险/.test(fullProductName)) {
                return "年金险";
            }
            let shortName = fullProductName.replace(/[·\s版\d]+$/, '').substring(0, 6);
            if (shortName.length < 2) shortName = "保险";
            return shortName;
        }
        
        // 将日期转为 M月D日 格式
        function formatMonthDay(expireDate) {
            if (!expireDate || !expireDate.match(/\d{4}-\d{2}-\d{2}/)) {
                return "";
            }
            const parts = expireDate.split('-');
            if (parts.length !== 3) return "";
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            return `${month}月${day}日`;
        }
        
        // 续保提醒解析器
        const RenewalParser = {
            typeName: 'renewal',
            match: function(text) {
                return /投保的.+（保单号：.+，被保人：.+）将于\d{4}-\d{2}-\d{2}到期.*重新投保/.test(text);
            },
            parse: function(fullText) {
                var pattern = /您的客户([\u4e00-\u9fa5]+)投保的([\s\S]+?)（保单号：([^，]+?)，被保人：([\u4e00-\u9fa5]+)）将于(\d{4}-\d{2}-\d{2})到期，请及时提醒客户通过以下链接重新投保：(https?:\/\/[^\s]+)/g;
                var results = [];
                var match;
                while ((match = pattern.exec(fullText)) !== null) {
                    var policyHolder = match[1].trim();
                    var productNameRaw = match[2].trim().replace(/\s+/g, ' ');
                    var productName = productNameRaw;
                    var policyNo = match[3].trim();
                    var insured = match[4].trim();
                    var expireDate = match[5];
                    var renewalLink = match[6].trim().replace(/[。，,、\s]+$/, '');
                    
                    var productType = extractProductType(productName);
                    var monthDay = formatMonthDay(expireDate);
                    
                    results.push({
                        policyHolder: policyHolder,
                        productType: productType,
                        policyNo: policyNo,
                        insured: insured,
                        expireDate: expireDate,
                        renewalLink: renewalLink,
                        monthDay: monthDay
                    });
                }
                if (results.length === 0) return [];
                
                var outputBlocks = [];
                for (var i = 0; i < results.length; i++) {
                    var r = results[i];
                    var title = '⏰续保-' + r.insured + '-' + r.productType + '（' + r.monthDay + '）';
                    var block = title + '\n\n';
                    block += '【核心时效】到期日：' + r.expireDate + '（请务必在此之前完成！）\n';
                    block += '【跟进建议】建议在 ' + r.expireDate + ' 前7-10天联系客户，预留沟通和转账时间。\n\n';
                    block += '投保人：' + r.policyHolder + '\n';
                    block += '被保人：' + r.insured + '\n';
                    block += '保单号：' + r.policyNo + '\n\n';
                    block += '续保链接：' + r.renewalLink + '\n';
                    block += '备注：如客户已自行投保请忽略。';
                    outputBlocks.push(block);
                }
                return outputBlocks;
            }
        };
        
        var parsers = [RenewalParser];
        
        function processUniversal(rawText) {
            if (!rawText || rawText.trim() === '') {
                return { success: false, output: '' };
            }
            var allBlocks = [];
            for (var i = 0; i < parsers.length; i++) {
                var parser = parsers[i];
                if (parser.match && parser.match(rawText)) {
                    var parsedItems = parser.parse(rawText);
                    if (parsedItems && parsedItems.length) {
                        for (var j = 0; j < parsedItems.length; j++) {
                            allBlocks.push(parsedItems[j]);
                        }
                    }
                }
            }
            if (allBlocks.length === 0) {
                return { success: false, output: '' };
            }
            // 简单去重
            var uniqueMap = {};
            var uniqueBlocks = [];
            for (var k = 0; k < allBlocks.length; k++) {
                if (!uniqueMap[allBlocks[k]]) {
                    uniqueMap[allBlocks[k]] = true;
                    uniqueBlocks.push(allBlocks[k]);
                }
            }
            return { success: true, output: uniqueBlocks.join('\n\n') };
        }
        
        // DOM 元素
        var textarea = document.getElementById('rawInput');
        var processBtn = document.getElementById('processBtn');
        var clearBtn = document.getElementById('clearBtn');
        var outputDiv = document.getElementById('outputArea');
        var copyBtn = document.getElementById('copyResultBtn');
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function updateOutput(content) {
            if (!content) {
                outputDiv.innerHTML = '<div class="empty-hint">⚠️ 未能识别到任何支持的消息类型。<br>请确保文本格式符合续保提醒规则。</div>';
                return;
            }
            outputDiv.innerHTML = '<div style="white-space: pre-wrap; font-family: inherit;">' + escapeHtml(content) + '</div>';
        }
        
        function handleProcess() {
            var raw = textarea.value;
            if (!raw.trim()) {
                outputDiv.innerHTML = '<div class="empty-hint">📭 输入框为空，请粘贴续保提醒文本</div>';
                return;
            }
            var result = processUniversal(raw);
            if (!result.success || !result.output) {
                updateOutput('');
                return;
            }
            updateOutput(result.output);
        }
        
        function clearAll() {
            textarea.value = '';
            outputDiv.innerHTML = '<div class="empty-hint">✨ 已清空，粘贴续保提醒文本后点击处理</div>';
        }
        
        async function copyResult() {
            var textToCopy = '';
            var outputContentDiv = outputDiv.querySelector('div');
            if (outputContentDiv && !outputDiv.querySelector('.empty-hint')) {
                textToCopy = outputContentDiv.innerText || outputContentDiv.textContent;
            } else {
                var hintDiv = outputDiv.querySelector('.empty-hint');
                if (hintDiv) {
                    textToCopy = hintDiv.innerText;
                } else {
                    textToCopy = outputDiv.innerText || '';
                }
            }
            
            if (!textToCopy || textToCopy.indexOf('未能识别到任何支持的消息类型') !== -1 || textToCopy.indexOf('等待处理') !== -1) {
                if (!confirm('当前没有有效的结构化结果，是否仍要复制提示信息？')) {
                    return;
                }
            }
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    showCopySuccess();
                    return;
                } catch (err) {
                    // fallback to execCommand
                }
            }
            
            var tempTextarea = document.createElement('textarea');
            tempTextarea.value = textToCopy;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            tempTextarea.setSelectionRange(0, 99999);
            var success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                // ignore
            }
            document.body.removeChild(tempTextarea);
            
            if (success) {
                showCopySuccess();
            } else {
                alert('复制失败，请手动选择文本后复制');
            }
        }
        
        function showCopySuccess() {
            var originalText = copyBtn.innerText;
            copyBtn.innerText = '✅ 已复制！';
            setTimeout(function() {
                copyBtn.innerText = originalText;
            }, 1500);
        }
        
        processBtn.addEventListener('click', handleProcess);
        clearBtn.addEventListener('click', clearAll);
        copyBtn.addEventListener('click', copyResult);
        
        textarea.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                handleProcess();
            }
        });
    })();
</script>
</body>
</html>
