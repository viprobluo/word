<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>写字台</title>
    <style>
        /* 重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            color: white;
            font-family: 'DeDaoJinKai', 'HarmonyOS Sans SC', sans-serif;
            display: flex;
            flex-direction: row;
            /* PC端行排列 */
        }

        /* ===== 侧边栏 ===== */
        #sidebar {
            width: 220px;
            min-width: 220px;
            height: 100%;
            background-color: #2a2a2a;
            border-right: 1px solid #555;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 5;
        }

        #sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        #sidebar-header h3 {
            font-size: 16px;
            font-weight: normal;
            color: #ccc;
        }

        #newDocBtn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        #newDocBtn:hover {
            color: #8cf;
        }

        #doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid #3a3a3a;
            transition: background 0.15s;
        }
        .doc-item:hover {
            background-color: #3a3a3a;
        }
        .doc-item.active {
            background-color: #4a4a4a;
            border-left: 3px solid #8cf;
        }

        .doc-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            color: #ddd;
        }
        .doc-item.active .doc-title {
            color: #fff;
        }

        .doc-delete {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            line-height: 1;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .doc-delete:hover {
            color: #f66;
        }

        /* ===== 主区域 ===== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* 按钮容器 - 固定顶部，宽度与编辑器一致 */
        .button-container {
            position: relative;
            top: 0;
            left: 0;
            transform: none;
            width: 100%;
            max-width: 60ch;
            min-width: 60ch;
            text-align: center;
            z-index: 10;
            padding: 10px 0 6px 0;
            background-color: transparent;
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .button-container button {
            display: inline-block;
            padding: 8px 15px;
            cursor: pointer;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background-color 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .button-container button:hover {
            background-color: #555;
        }

        /* 手机端“文档”按钮（PC端隐藏） */
        #mobileDocBtn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0 6px;
        }

        /* 编辑器容器 */
        #editor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-width: 60ch;
            min-width: 60ch;
            height: 100%;
            padding-bottom: 20px;
            flex: 1;
            margin-top: 0;
            position: relative;
        }

        #read {
            font-family: 'HarmonyOS Sans SC', sans-serif;
            font-size: 12px;
            color: rgba(250, 235, 215, 0.406);
            margin-top: 6px;
            margin-bottom: 5px;
            width: 100%;
            text-align: left;
            user-select: none;
            padding-left: 0;
            flex-shrink: 0;
        }

        #editor {
            width: 100%;
            height: 100%;
            padding: 20px;
            border: 1px solid white;
            background-color: #333;
            color: white;
            text-align: left;
            box-sizing: border-box;
            resize: none;
            overflow-y: scroll;
            font-family: 'DeDaoJinKai', 'HarmonyOS Sans SC', sans-serif;
            font-size: 22px;
            outline: none;
            line-height: 1.6em;
            flex: 1;
        }

        #editor::-webkit-scrollbar {
            width: 8px;
        }
        #editor::-webkit-scrollbar-track {
            background-color: #333;
        }
        #editor::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 10px;
        }

        /* ===== 手机端浮层 ===== */
        #mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }
        #mobile-overlay.show {
            display: flex;
        }

        #mobile-drawer {
            width: 100%;
            max-height: 80%;
            background: #2a2a2a;
            border-radius: 16px 16px 0 0;
            padding: 16px 0 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        #mobile-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px 12px 16px;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }
        #mobile-drawer-header h3 {
            font-size: 16px;
            font-weight: normal;
            color: #ccc;
        }
        #mobileNewDocBtn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
        }
        #mobileNewDocBtn:hover {
            color: #8cf;
        }
        #mobileDrawerClose {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
        }

        #mobile-doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .mobile-doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #3a3a3a;
        }
        .mobile-doc-item.active {
            background-color: #4a4a4a;
        }
        .mobile-doc-item .doc-title {
            font-size: 15px;
            color: #ddd;
        }
        .mobile-doc-item .doc-delete {
            color: #888;
        }
        .mobile-doc-item .doc-delete:hover {
            color: #f66;
        }

        /* ===== 响应式：手机端 ===== */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            #sidebar {
                display: none;
            }

            #mobileDocBtn {
                display: inline-block;
            }

            .button-container {
                max-width: 100%;
                min-width: 0;
                width: 100%;
                padding: 8px 0 6px 0;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 0;
                background-color: #333;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
                position: sticky;
                top: 0;
                z-index: 10;
            }

            .button-container button {
                padding: 6px 12px;
                font-size: 12px;
                margin: 2px 2px;
            }

            #editor-container {
                max-width: 100%;
                min-width: 0;
                width: 92%;
                height: 100%;
                padding-bottom: 10px;
                margin: 0 auto;
            }

            #editor {
                font-size: 16px;
                padding: 12px;
            }

            #read {
                text-align: left;
                margin-left: 0;
                font-size: 11px;
                margin-top: 6px;
                width: 100%;
            }

            #cbzButton {
                display: none;
            }

            /* 隐藏PC端新建按钮，手机端用浮层里的 */
            #newDocBtn {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .button-container button {
                padding: 5px 10px;
                font-size: 11px;
                margin: 2px 2px;
            }
            #editor {
                font-size: 15px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 侧边栏 ===== -->
    <div id="sidebar">
        <div id="sidebar-header">
            <h3>📄 文档</h3>
            <button id="newDocBtn" title="新建文档">+</button>
        </div>
        <div id="doc-list"></div>
    </div>

    <!-- ===== 主区域 ===== -->
    <div id="main">
        <div class="button-container">
            <button id="mobileDocBtn" title="文档列表">📄</button>
            <button id="scrollTopButton">置顶</button>
            <button id="cleanMarkdown">|</button>
            <button id="xh">序号</button>
            <button id="numBigButton">字体滤镜</button>
            <button id="copyButton">复制</button>
            <button id="clearButton">清空</button>
            <button id="cbzButton">错别字</button>
        </div>

        <div id="editor-container">
            <div id="read">全文 0 字 预计 0 分钟</div>
            <textarea id="editor" autofocus></textarea>
        </div>
    </div>

    <!-- ===== 手机端浮层 ===== -->
    <div id="mobile-overlay">
        <div id="mobile-drawer">
            <div id="mobile-drawer-header">
                <h3>📄 文档</h3>
                <div>
                    <button id="mobileNewDocBtn" title="新建文档">+</button>
                    <button id="mobileDrawerClose" title="关闭">✕</button>
                </div>
            </div>
            <div id="mobile-doc-list"></div>
        </div>
    </div>

    <script src="xzt.js"></script>
</body>

</html>
