<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>照片批量加水印</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f3f4f6; color: #1f2329; height: 100vh; overflow: hidden;
  }
  /* 初始页：只有一个上传按钮 */
  .start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; background: #f3f4f6;
  }
  .startbtn {
    width: 150px; height: 150px; border-radius: 28px; border: none;
    background: #4a90e2; color: #fff; font-size: 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 10px 30px rgba(74,144,226,.4);
  }
  .startbtn:active { transform: scale(.97); }
  .startbtn b { font-size: 42px; line-height: 1; font-weight: 400; }
  .start p { color: #8a93a2; font-size: 13px; margin: 0; }

  /* 工作区 */
  .work { display: flex; height: 100vh; }
  .preview-wrap {
    flex: 1 1 auto; position: relative; min-width: 0;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: #000;   /* 黑色底，衬托照片 */
  }
  .preview-wrap canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
  .navarrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.5); color: #fff; font-size: 26px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .navarrow:disabled { display: none; }
  .navarrow.left { left: 16px; } .navarrow.right { right: 16px; }
  .closex {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.6); color: #fff; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .closex:hover, .navarrow:hover { background: rgba(0,0,0,.8); }

  /* 操作区（PC 左侧栏） */
  .side {
    flex: 0 0 268px; width: 268px; background: #fff; border-right: 1px solid #e6e8eb;
    padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow: auto; order: -1;
  }
  .brand { font-weight: 600; font-size: 15px; }
  .brand span { color: #4a90e2; }
  .mini { height: 30px; padding: 0 10px; border: 1px solid #cdd1d8; background: #fff; border-radius: 7px; font-size: 12px; cursor: pointer; }
  .side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ctl > label { display: block; font-size: 12px; color: #667085; margin-bottom: 6px; }
  .optrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { min-height: 34px; min-width: 0; padding: 0 12px; border: 1px solid #cdd1d8; background: #fff; border-radius: 7px; font-size: 13px; cursor: pointer; }
  .opt.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
  .hint { font-size: 11px; color: #98a2b3; line-height: 1.5; margin: 0; }
  .spacer { flex: 1 1 auto; }
  .count { font-size: 11px; color: #667085; text-align: center; }
  .count-top { display: none; }  /* PC端：顶部计数不显示，用底部的 */
  .btn-row { display: flex; flex-direction: column; gap: 8px; }  /* PC端：两个按钮上下排 */
  .applyall { height: 36px; width: 100%; border: 1px solid #4a90e2; border-radius: 8px; background: #fff; color: #4a90e2; font-size: 13px; cursor: pointer; }
  .applyall:disabled { border-color: #cdd1d8; color: #b6bcc6; cursor: not-allowed; }
  .applyall:not(:disabled):hover { background: #eef4ff; }
  .export { height: 42px; width: 100%; border: none; border-radius: 8px; background: #4a90e2; color: #fff; font-size: 15px; cursor: pointer; }
  .export:disabled { background: #b6bcc6; cursor: not-allowed; }

  @media (max-width: 760px) {
    .work { flex-direction: column; }
    .preview-wrap { flex: 1 1 auto; min-height: 0; padding: 8px; order: 1; }
    .side {
      flex: 0 0 auto; width: 100%; border-right: none; border-top: 1px solid #e6e8eb;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px; max-height: 40vh; order: 2;
    }
    .navarrow { width: 42px; height: 42px; font-size: 22px; }
    .navarrow.left { left: 8px; } .navarrow.right { right: 8px; }
    .closex { top: 8px; right: 8px; }
    .ctl { display: flex; align-items: center; gap: 8px; }
    .ctl > label { margin-bottom: 0; flex: 0 0 auto; font-size: 11px; width: 44px; }
    .opt { min-height: 32px; padding: 0 10px; font-size: 12px; }
    .side-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: -2px; }
    .side-head .brand { display: none; }
    .count { display: none; }   /* 手机端：底部计数隐藏，用顶部side-head里的 */
    .count-top { display: inline-block; font-size: 11px; color: #667085; margin-right: auto; }  /* 贴左，让出右边上传按钮 */
    .btn-row { flex-direction: row; gap: 6px; }  /* 手机端：两个按钮左右并排一行 */
    .btn-row > .applyall, .btn-row > .export { flex: 1 1 0; min-width: 0; }  /* 平分宽度 */
    .applyall { height: 36px; font-size: 12px; }
    .export { height: 36px; font-size: 12px; }
  }
</style>
</head>
<body>
  <input type="file" id="file" accept="image/*" multiple hidden>

  <div class="start" id="start">
    <button class="startbtn" id="startBtn"><b>＋</b>上传照片</button>
    <p>支持多张 · 原图导出 · 不压缩</p>
  </div>

  <div class="work" id="work" hidden>
    <section class="preview-wrap" id="previewWrap">
      <canvas id="cv" width="0" height="0"></canvas>
      <button class="navarrow left" id="prev" disabled>‹</button>
      <button class="navarrow right" id="next" disabled>›</button>
      <button class="closex" id="closeBtn" title="移除这张" style="display:none">✕</button>
    </section>
    <aside class="side">
      <div class="side-head">
        <div class="brand">照片批量<span>加水印</span></div>
        <div class="count-top" id="countTop">未上传</div>
        <button class="mini" id="uploadBtn">＋ 上传</button>
      </div>
      <div class="ctl">
        <label>大小</label>
        <div class="optrow" id="sizeRow">
          <button type="button" class="opt" data-size="10">小</button>
          <button type="button" class="opt" data-size="15">中</button>
          <button type="button" class="opt" data-size="20">大</button>
        </div>
      </div>
      <div class="ctl">
        <label>边距</label>
        <div class="optrow" id="mgnRow">
          <button type="button" class="opt" data-mgn="3">3%</button>
          <button type="button" class="opt" data-mgn="5">5%</button>
          <button type="button" class="opt" data-mgn="8">8%</button>
          <button type="button" class="opt" data-mgn="10">10%</button>
        </div>
      </div>
      <div class="ctl">
        <label>透明度</label>
        <div class="optrow" id="opaRow">
          <button type="button" class="opt" data-opa="60">60%</button>
          <button type="button" class="opt" data-opa="80">80%</button>
          <button type="button" class="opt" data-opa="100">100%</button>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="count" id="count">未上传</div>
      <div class="btn-row">
        <button class="applyall" id="applyAll" disabled>应用到全部</button>
        <button class="export" id="exportAll" disabled>导出全部</button>
      </div>
    </aside>
  </div>

const $ = id => document.getElementById(id);
const wm = new Image(); let wmReady = false;
wm.onload = () => { wmReady = true; renderPreview(); };
wm.src = WATERMARKS[WM_INDEX].src;

const files = []; // {name, type, img, wmSize, mgn, opa}
let cur = 0;
const cv = $("cv"), ctx = cv.getContext("2d");
let exporting = false;  // 导出中互斥锁：防重复点击/重入导致重复下载

// 设置（默认值：新上传的照片用该配置；之后每张照片独立保存一份参数）
const SET_KEY = "签章设置_v2";
let mgn = 3, opa = 100;
function saveSet(){ try{ localStorage.setItem(SET_KEY, JSON.stringify({wmSize, mgn, opa})); }catch(e){} }
function loadSet(){
  let o=null; try{ o = JSON.parse(localStorage.getItem(SET_KEY)); }catch(e){}
  if(!o) return;
  if(typeof o.wmSize === "number") wmSize = o.wmSize;
  if(typeof o.mgn === "number") mgn = o.mgn;
  if(typeof o.opa === "number") opa = o.opa;
}
function syncUI(){
  document.querySelectorAll("#sizeRow .opt").forEach(b=>b.classList.toggle("active", +b.dataset.size===wmSize));
  document.querySelectorAll("#mgnRow .opt").forEach(b=>b.classList.toggle("active", +b.dataset.mgn===mgn));
  document.querySelectorAll("#opaRow .opt").forEach(b=>b.classList.toggle("active", +b.dataset.opa===opa));
}
// 把当前照片的参数加载到全局并同步UI（切图后调用）
function loadCurCfg(){
  if(files.length === 0) return;
  const it = files[cur];
  wmSize = it.wmSize; mgn = it.mgn; opa = it.opa; syncUI();
}
// 把当前全局参数写回当前照片（修改参数后调用）
function saveCurCfg(){
  if(files.length === 0) return;
  const it = files[cur];
  it.wmSize = wmSize; it.mgn = mgn; it.opa = opa;
}
function bindRow(sel, attr, setter){
  document.querySelectorAll(sel+" .opt").forEach(b=>{
    b.addEventListener("click", ()=>{
      setter(+b.dataset[attr]);
      saveCurCfg();        // 写回当前照片
      syncUI();
      saveSet();           // 同时更新默认值（新上传照片用这个）
      renderPreview();
    });
  });
}
bindRow("#sizeRow","size",(v)=>{ wmSize = v; });
bindRow("#mgnRow","mgn",(v)=>{ mgn = v; });
bindRow("#opaRow","opa",(v)=>{ opa = v; });
loadSet();

// 文件上传
$("file").addEventListener("change", e => { addFiles(e.target.files); e.target.value=""; });
$("startBtn").addEventListener("click", () => $("file").click());
$("uploadBtn").addEventListener("click", () => $("file").click());
function dropOn(el){ el.addEventListener("dragover", e=>{e.preventDefault();}); el.addEventListener("drop", e=>{ e.preventDefault(); if(e.dataTransfer.files) addFiles(e.dataTransfer.files); }); }
dropOn($("start")); dropOn($("previewWrap"));

function addFiles(list){
  for(const f of list){
    if(!f.type.startsWith("image/")) continue;
    const url = URL.createObjectURL(f);
    const img = new Image();
    // 使用当前全局参数作为这张新照片的默认参数
    const defWmSize = wmSize, defMgn = mgn, defOpa = opa;
    let loaded = false;  // 一次性保护：防止 img.onload 在某些浏览器/缓存场景重复触发导致重复push
    img.onload = () => {
      if(loaded) return;
      loaded = true;
      files.push({name:f.name, type:f.type, img, wmSize:defWmSize, mgn:defMgn, opa:defOpa});
      if(cur>=files.length-1) cur=files.length-1;
      updateView();
    };
    img.src = url;
  }
}

function updateView(){
  const has = files.length > 0;
  $("start").hidden = has;
  $("work").hidden = !has;
  const txt = has ? (cur+1)+" / "+files.length+" 张" : "未上传";
  $("count").textContent = txt;
  if($("countTop")) $("countTop").textContent = txt;
  $("exportAll").disabled = !has || !wmReady;
  $("applyAll").disabled = !has || files.length < 2;  // 只有1张时没必要应用到全部
  if(has) loadCurCfg();      // 有照片时，把当前照片参数同步到UI
  renderPreview();
}

function updateNav(){
  const has = files.length > 0;
  $("prev").disabled = !has || cur <= 0;
  $("next").disabled = !has || cur >= files.length-1;
  $("closeBtn").style.display = has ? "" : "none";
}

function renderPreview(){
  updateNav();
  if(!wmReady || files.length === 0){ cv.width=cv.height=0; return; }
  const it = files[cur];
  const w = it.img.naturalWidth, h = it.img.naturalHeight;
  const cap = 1600;
  const scale = Math.min(1, cap / Math.max(w, h));
  cv.width = Math.round(w * scale);
  cv.height = Math.round(h * scale);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(it.img, 0, 0, cv.width, cv.height);
  drawWatermark(ctx, cv.width, cv.height, it);  // 传这张照片的独立参数
}

$("prev").addEventListener("click", ()=>{ if(cur>0){ cur--; loadCurCfg(); updateCount(); renderPreview(); } });
$("next").addEventListener("click", ()=>{ if(cur<files.length-1){ cur++; loadCurCfg(); updateCount(); renderPreview(); } });
$("closeBtn").addEventListener("click", ()=>{
  files.splice(cur, 1);
  if(cur >= files.length) cur = Math.max(0, files.length-1);
  updateView();
});
window.addEventListener("resize", renderPreview);
function updateCount(){
  const txt = (cur+1)+" / "+files.length+" 张";
  $("count").textContent = txt;
  if($("countTop")) $("countTop").textContent = txt;
}

// 水印绘制（cfg 可选，传则用该照片独立参数，否则用全局）
function layout(imgW, imgH, cfg){
  const s = cfg && typeof cfg.wmSize === "number" ? cfg.wmSize : wmSize;
  const m = cfg && typeof cfg.mgn    === "number" ? cfg.mgn    : mgn;
  const wmW = imgW * s/100;
  const wmH = wmW * (wm.height/wm.width);
  const x = (imgW - wmW) / 2;
  const y = imgH - wmH - imgH * m/100;
  return {x, y, wmW, wmH, o: cfg && typeof cfg.opa==="number" ? cfg.opa : opa};
}
function drawWatermark(c, imgW, imgH, cfg){
  const {x,y,wmW,wmH,o} = layout(imgW, imgH, cfg);
  c.globalAlpha = o/100;
  if(WM_SHADOW > 0){
    const k = WM_SHADOW/100;
    c.shadowColor = "rgba(0,0,0,0.5)";
    c.shadowBlur = Math.max(0.5, wmW * k * 0.03);
    c.shadowOffsetX = 0;
    c.shadowOffsetY = Math.max(0.5, wmH * k * 0.03);
  }
  c.imageSmoothingQuality = "high";
  c.drawImage(wm, x, y, wmW, wmH);
  c.globalAlpha = 1; c.shadowColor="transparent"; c.shadowBlur=0; c.shadowOffsetX=0; c.shadowOffsetY=0;
}

// toBlob 兜底 polyfill（少数极老浏览器/旧版 Safari 缺失）
if(typeof HTMLCanvasElement !== "undefined" && !HTMLCanvasElement.prototype.toBlob){
  Object.defineProperty(HTMLCanvasElement.prototype, "toBlob", {
    value: function(cb, type, quality){
      const bin = atob(this.toDataURL(type, quality).split(",")[1]);
      const len = bin.length; const arr = new Uint8Array(len);
      for(let i=0;i<len;i++) arr[i] = bin.charCodeAt(i);
      cb(new Blob([arr], {type: type||"image/png"}));
    }
  });
}

// 导出单张：返回 Promise，内部用 Blob + ObjectURL（移动端兼容性远好于 dataURL）
function exportOne(i){
  return new Promise((resolve, reject)=>{
    try{
      const it = files[i];
      const c = document.createElement("canvas");
      c.width = it.img.naturalWidth; c.height = it.img.naturalHeight;
      const cc = c.getContext("2d");
      cc.drawImage(it.img, 0, 0);
      drawWatermark(cc, c.width, c.height, it);  // 使用该照片自己的参数
      const isJpeg = it.type==="image/jpeg" || /\.jpe?g$/i.test(it.name);
      c.toBlob((blob)=>{
        try{
          if(!blob){ reject(new Error("canvas.toBlob 返回空")); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.rel = "noopener";
          a.download = it.name.replace(/(\.[^.]+)$/, "_水印$1");
          // 一次性保护：防止某些浏览器对 click 重复派发导致两次下载
          a._fired = false;
          a.addEventListener("click", (ev)=>{
            if(a._fired){ ev.preventDefault(); ev.stopImmediatePropagation(); return; }
            a._fired = true;
          }, true);
          document.body.appendChild(a);
          a.click();
          // 异步清理：等 click 分发完 + 浏览器处理下载请求；revokeObjectURL 释放 Blob 内存
          setTimeout(()=>{
            try{ a.remove(); }catch(e){}
            try{ URL.revokeObjectURL(url); }catch(e){}
            resolve(true);
          }, 180);
        }catch(e){ reject(e); }
      }, isJpeg?"image/jpeg":"image/png", isJpeg?1:undefined);
    }catch(e){ reject(e); }
  });
}
// 应用到全部：把当前照片的参数复制到所有照片
$("applyAll").addEventListener("click", ()=>{
  if(files.length < 2) return;
  const src = files[cur];
  for(let i=0;i<files.length;i++){
    if(i===cur) continue;
    files[i].wmSize = src.wmSize;
    files[i].mgn    = src.mgn;
    files[i].opa    = src.opa;
  }
  renderPreview();
  // 轻量反馈：按钮临时变色提示
  const btn = $("applyAll");
  const old = btn.textContent;
  btn.textContent = "已应用 ✓";
  setTimeout(()=>{ btn.textContent = old; }, 1200);
});
$("exportAll").addEventListener("click", async ()=>{
  // 重入保护：双击/移动端快速点两次都会被挡（即使按钮 disabled 尚未生效也无妨）
  if(exporting) return;
  if(files.length === 0) return;
  exporting = true;
  const btn = $("exportAll");
  btn.disabled = true;
  // 关键：一次性拍下 files.length 快照；即使循环中异步 img.onload push 了新元素也不会多跑一圈
  const total = files.length;
  let ok = 0;
  // 异步串行下载：移动端浏览器对"同一用户手势触发多次程序化下载"有严格限制
  // 第一张立即执行（消耗用户手势），之后每张之间间隔释放主线程，让浏览器把每次 a.click() 识别为合法下载
  for(let i=0;i<total;i++){
    try {
      btn.textContent = "导出中…(" + (i+1) + "/" + total + ")";
      await exportOne(i);
      ok++;
      // 每张之间停顿：把下一次 a.click() 分派到独立宏任务，绕过移动端同一用户手势只能下载一次的限制
      if(i < total-1) await new Promise(r => setTimeout(r, 120));
    } catch(e){
      console.error("导出失败:", files[i] && files[i].name, e);
    }
  }
  btn.textContent = "导出全部";
  btn.disabled = files.length === 0;
  $("applyAll").disabled = files.length < 2;
  exporting = false;
  if(ok === 0) alert("导出失败，请查看浏览器控制台报错");
  else if(ok < total) alert("部分导出失败：" + ok + "/" + total + " 成功");
});
</script>
</body>
</html>
