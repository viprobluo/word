<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>写字台</title>
    <style>
        body,
        html {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            color: white;
            font-family: 'DeDaoJinKai', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .button-container {
            position: fixed;
            top: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            padding: 10px 0 10px;
            background-color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button-container button {
            display: inline-block;
            margin: 5px 1%;
            padding: 8px 15px;
            cursor: pointer;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            flex-shrink: 0;
        }

        .button-container button:hover {
            background-color: #555;
        }

        #editor-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            padding-top: 72px;
            width: 100%;
        }

        #read {
            font-family: 'HarmonyOS Sans SC', sans-serif;
            font-size: 12px;
            color: rgba(250, 235, 215, 0.406);
            margin: 2px 0 4px 5%;
            text-align: left;
            width: 90%;
            flex-shrink: 0;
        }

        #editor {
            width: 90%;
            min-width: 10ch;
            max-width: 100%;
            height: 100%;
            padding: 10px;
            border: 1px solid white;
            background-color: #333;
            color: white;
            text-align: left;
            box-sizing: border-box;
            resize: none;
            overflow-y: scroll;
            font-family: 'HarmonyOS Sans SC', sans-serif;
            font-size: 22px;
            outline: none;
            line-height: 1.5em;
            flex-grow: 1;
            margin-bottom: 10px;
        }

        #editor::-webkit-scrollbar {
            width: 8px;
        }

        #editor::-webkit-scrollbar-track {
            background-color: #333;
        }

        #editor::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 10px;
        }

        .resizer {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: transparent;
            cursor: se-resize;
        }

        @media (max-width: 768px) {
            #editor {
                font-size: 16px;
                width: 92%;
            }
            .button-container button {
                padding: 6px 10px;
                font-size: 12px;
                margin: 3px 0.5%;
            }
            #read {
                font-size: 11px;
                margin: 2px 0 2px 4%;
            }
        }
    </style>
</head>

<body>
    <div class="button-container">
        <button id="scrollTopButton">置顶</button>
        <button id="cleanMarkdown">|</button>
        <button id="xh">序号</button>
        <button id="numBigButton">字体滤镜</button>
        <button id="copyButton">复制</button>
        <button id="clearButton">清空</button>
    </div>
    <div id="editor-container">
        <div id="read">全文 0 字 预计 0 分钟</div>
        <textarea id="editor" autofocus></textarea>
        <div class="resizer"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // ---------- 获取元素 ----------
            const editor = document.getElementById('editor');
            const scrollTopButton = document.getElementById('scrollTopButton');
            const numBigButton = document.getElementById('numBigButton');
            const copyButton = document.getElementById('copyButton');
            const xhButton = document.getElementById('xh');
            const cleanMarkdownButton = document.getElementById('cleanMarkdown');
            const clearButton = document.getElementById('clearButton');
            const readDisplay = document.getElementById('read');

            // 获取当前URL
            var currentUrl = window.location.href;

            // ---------- 撤销历史 ----------
            var undoStack = [];
            const MAX_UNDO = 50;

            function saveState() {
                undoStack.push(editor.value);
                if (undoStack.length > MAX_UNDO) {
                    undoStack.shift();
                }
            }

            // ---------- 字数统计 ----------
            function countWords(text) {
                var wordRegex = /[\u4e00-\u9fa5a-zA-Z0-9]+/g;
                var matches = text.match(wordRegex);
                return matches ? matches.join('').length : 0;
            }

            function madeReadTime(wordCount) {
                const result = wordCount / 350;
                return Number(result.toFixed(1));
            }

            function updateReadTime() {
                var text = editor.value;
                var wordCount = countWords(text);
                var readTime = madeReadTime(wordCount);
                readDisplay.textContent = "全文 " + wordCount + " 字 预计 " + readTime + " 分钟";
            }

            // 置顶
            function scrollTop() {
                editor.scrollTo({
                    top: 0,
                    left: 0,
                    behavior: 'smooth'
                });
            }

            // 加载文本
            function loadText() {
                const text = localStorage.getItem(currentUrl);
                if (text) {
                    editor.value = text;
                } else {
                    localStorage.removeItem(currentUrl);
                }
            }
            loadText();
            updateReadTime();
            editor.scrollBy = 0;

            function saveText() {
                localStorage.setItem(currentUrl, editor.value);
            }

            // ---------- 快捷键 ----------
            function handleKeyDown(event) {
                // Ctrl+Z 撤销
                if (event.ctrlKey && event.key === 'z' && document.activeElement === editor) {
                    if (undoStack.length > 0) {
                        event.preventDefault();
                        const prevText = undoStack.pop();
                        editor.value = prevText;
                        updateReadTime();
                        saveText();
                        showAutoCloseAlert("已撤销");
                    }
                    return;
                }

                if (event.altKey && event.key === '1') {
                    event.preventDefault();
                    scrollTop();
                }
                if (event.altKey && event.key === '4') {
                    event.preventDefault();
                    numBig();
                }
                if (event.altKey && event.key.toLowerCase() === 'c') {
                    event.preventDefault();
                    copy();
                }
                if (event.ctrlKey && event.key.toLowerCase() === 's') {
                    event.preventDefault();
                    reformatText();
                }
            }
            document.addEventListener('keydown', handleKeyDown);

            // ---------- 花边字（保留但不启用） ----------
            function addFancyBorders() {
                saveState();
                let text = editor.value;
                const urlRegex = /https?:\/\/[^\s]+/g;
                const urlPlaceholders = [];
                text = text.replace(urlRegex, function(match) {
                    urlPlaceholders.push(match);
                    return String.fromCharCode(0xE000 + urlPlaceholders.length - 1);
                });

                const fancyChars = ['໌້', ' ຼ'];
                const characters = text.split('');
                const decoratedText = characters.map(char => char);
                const punctuationRegex = /[.,、\/#!$%\^&\*;:{}=\-_`~()]/g;
                const newlineRegex = /\n/g;
                const digitRegex = /\d/g;
                let match;
                const indexesToSkip = [];
                while ((match = punctuationRegex.exec(text)) !== null) {
                    indexesToSkip.push(match.index);
                }
                while ((match = newlineRegex.exec(text)) !== null) {
                    indexesToSkip.push(match.index);
                }
                while ((match = digitRegex.exec(text)) !== null) {
                    indexesToSkip.push(match.index);
                }

                for (let i = 0; i < decoratedText.length; i++) {
                    if (indexesToSkip.includes(i)) continue;
                    const randomChar = fancyChars[Math.floor(Math.random() * fancyChars.length)];
                    const random_number = Math.floor(Math.random() * 9);
                    if (i % random_number === 0 && Math.random() > 0.9) {
                        decoratedText[i] += randomChar;
                    }
                }

                text = decoratedText.join('');
                text = text.replace(/[\uE000-\uE7FF]/g, function(ch) {
                    const idx = ch.charCodeAt(0) - 0xE000;
                    return urlPlaceholders[idx] || ch;
                });
                editor.value = text;
                updateReadTime();
                saveText();
            }

            // ---------- 数字加粗（保留原有功能，不做修改） ----------
            function numBig() {
                saveState();
                let text = editor.value;
                const urlRegex = /https?:\/\/[^\s]+/g;
                const urlPlaceholders = [];
                text = text.replace(urlRegex, function(match) {
                    urlPlaceholders.push(match);
                    return String.fromCharCode(0xE000 + urlPlaceholders.length - 1);
                });

                const numBig = localStorage.getItem('numBig');
                if (numBig) {
                    text = text.replace(/𝟬/g, '0')
                        .replace(/𝟭/g, '1')
                        .replace(/𝟮/g, '2')
                        .replace(/𝟯/g, '3')
                        .replace(/𝟰/g, '4')
                        .replace(/𝟱/g, '5')
                        .replace(/𝟲/g, '6')
                        .replace(/𝟳/g, '7')
                        .replace(/𝟴/g, '8')
                        .replace(/𝟵/g, '9');
                    text = text.replace(/𝗔|𝗕|𝗖|𝗗|𝗘|𝗙|𝗚|𝗛|𝗜|𝗝|𝗞|𝗟|𝗠|𝗡|𝗢|𝗣|𝗤|𝗥|𝗦|𝗧|𝗨|𝗩|𝗪|𝗫|𝗬|𝗭/g, function (char) {
                        switch (char) {
                            case '𝗔': return 'A';
                            case '𝗕': return 'B';
                            case '𝗖': return 'C';
                            case '𝗗': return 'D';
                            case '𝗘': return 'E';
                            case '𝗙': return 'F';
                            case '𝗚': return 'G';
                            case '𝗛': return 'H';
                            case '𝗜': return 'I';
                            case '𝗝': return 'J';
                            case '𝗞': return 'K';
                            case '𝗟': return 'L';
                            case '𝗠': return 'M';
                            case '𝗡': return 'N';
                            case '𝗢': return 'O';
                            case '𝗣': return 'P';
                            case '𝗤': return 'Q';
                            case '𝗥': return 'R';
                            case '𝗦': return 'S';
                            case '𝗧': return 'T';
                            case '𝗨': return 'U';
                            case '𝗩': return 'V';
                            case '𝗪': return 'W';
                            case '𝗫': return 'X';
                            case '𝗬': return 'Y';
                            case '𝗭': return 'Z';
                            default: return char;
                        }
                    });
                    localStorage.removeItem('numBig');
                } else {
                    text = text.split('').map(char => {
                        switch (char) {
                            case '0': return '𝟬';
                            case '1': return '𝟭';
                            case '2': return '𝟮';
                            case '3': return '𝟯';
                            case '4': return '𝟰';
                            case '5': return '𝟱';
                            case '6': return '𝟲';
                            case '7': return '𝟳';
                            case '8': return '𝟴';
                            case '9': return '𝟵';
                            case 'a': return '𝗮';
                            case 'b': return '𝗯';
                            case 'c': return '𝗰';
                            case 'd': return '𝗱';
                            case 'e': return '𝗲';
                            case 'f': return '𝗳';
                            case 'g': return '𝗴';
                            case 'h': return '𝗵';
                            case 'i': return '𝗶';
                            case 'j': return '𝗷';
                            case 'k': return '𝗸';
                            case 'l': return '𝗹';
                            case 'm': return '𝗺';
                            case 'n': return '𝗻';
                            case 'o': return '𝗼';
                            case 'p': return '𝗽';
                            case 'q': return '𝗾';
                            case 'r': return '𝗿';
                            case 's': return '𝘀';
                            case 't': return '𝘁';
                            case 'u': return '𝘂';
                            case 'v': return '𝘃';
                            case 'w': return '𝘄';
                            case 'x': return '𝘅';
                            case 'y': return '𝘆';
                            case 'z': return '𝘇';
                            case 'A': return '𝗔';
                            case 'B': return '𝗕';
                            case 'C': return '𝗖';
                            case 'D': return '𝗗';
                            case 'E': return '𝗘';
                            case 'F': return '𝗙';
                            case 'G': return '𝗚';
                            case 'H': return '𝗛';
                            case 'I': return '𝗜';
                            case 'J': return '𝗝';
                            case 'K': return '𝗞';
                            case 'L': return '𝗟';
                            case 'M': return '𝗠';
                            case 'N': return '𝗡';
                            case 'O': return '𝗢';
                            case 'P': return '𝗣';
                            case 'Q': return '𝗤';
                            case 'R': return '𝗥';
                            case 'S': return '𝗦';
                            case 'T': return '𝗧';
                            case 'U': return '𝗨';
                            case 'V': return '𝗩';
                            case 'W': return '𝗪';
                            case 'X': return '𝗫';
                            case 'Y': return '𝗬';
                            case 'Z': return '𝗭';
                            default: return char;
                        }
                    }).join('');
                    localStorage.setItem('numBig', 1);
                }

                text = text.replace(/[\uE000-\uE7FF]/g, function(ch) {
                    const idx = ch.charCodeAt(0) - 0xE000;
                    return urlPlaceholders[idx] || ch;
                });
                editor.value = text;
                updateReadTime();
                saveText();
            }

            // ---------- 排版 ----------
            function reformatText(saveHistory = true) {
                if (saveHistory) saveState();
                try {
                    let text = editor.value;
                    if (text) {
                        const urlRegex = /https?:\/\/[^\s]+/g;
                        const urlPlaceholders = [];
                        text = text.replace(urlRegex, function(match) {
                            urlPlaceholders.push(match);
                            return String.fromCharCode(0xE000 + urlPlaceholders.length - 1);
                        });

                        text = text.replace(/,/g, '，').replace(/:/g, '：');
                        text = text.replace(/(\d+%?)-(\d+%?)/g, '$1~$2');
                        text = text.replace(/。[ \t]*$/gm, '');
                        text = text.replace(/([\u4e00-\u9fa5])([A-Za-z0-9])/g, '$1 $2');
                        text = text.replace(/([A-Za-z0-9])([\u4e00-\u9fa5])/g, '$1 $2');
                        text = text.replace(/([\u4e00-\u9fa5])(\d)/g, '$1 $2');
                        text = text.replace(/(\d)([\u4e00-\u9fa5])/g, '$1 $2');
                        text = text.replace(/(\d)([A-Za-z])/g, '$1 $2');
                        text = text.replace(/([A-Za-z])(\d)/g, '$1 $2');
                        text = text.replace(/“/g, '「').replace(/”/g, '」');
                        text = text.replace(/"([^"]+)"/g, '「$1」');
                        text = text.replace(/%([\u4e00-\u9fa5])/g, '% $1');
                        text = text.replace(/%\s+(?=[，,])/g, '%');
                        text = text.replace(new RegExp('\\[语音开始\\]', 'g'), '');
                        text = text.replace(new RegExp('\\[语音结束\\]', 'g'), '');
                        text = text.replace(/^\s+/, '');
                        text = text.replace(/(\n\s*){2,}/g, '\n\n');
                        text = removeTrailingEmptyLines(text);

                        text = text.replace(/[\uE000-\uE7FF]/g, function(ch) {
                            const idx = ch.charCodeAt(0) - 0xE000;
                            return urlPlaceholders[idx] || ch;
                        });

                        editor.value = text;
                        updateReadTime();
                        saveText();
                        showAutoCloseAlert("已美化保存");
                    } else {
                        localStorage.removeItem(currentUrl);
                    }
                } catch (e) {
                    console.error('排版出错:', e);
                    showAutoCloseAlert('排版出错，请检查控制台');
                }
            }

            // ---------- 复制 ----------
            async function copy(type) {
                try {
                    await navigator.clipboard.writeText(editor.value);
                    if (type !== "linkCbz") {
                        showAutoCloseAlert("复制成功");
                    }
                } catch (e) {
                    const textArea = document.createElement('textarea');
                    textArea.value = editor.value;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    if (type !== "linkCbz") {
                        showAutoCloseAlert("复制成功（降级方式）");
                    }
                }
            }

            // ---------- 辅助函数 ----------
            function removeTrailingEmptyLines(text) {
                var lines = text.split('\n');
                var lastNonEmptyLineIndex = lines.reduce((index, line, idx) => {
                    return line.trim() ? idx : index;
                }, -1);
                if (lastNonEmptyLineIndex === -1) {
                    return '';
                }
                return lines.slice(0, lastNonEmptyLineIndex + 1).join('\n');
            }

            // ---------- 清除 Markdown ----------
            function cleanMarkdown() {
                saveState();
                let text = editor.value;
                text = text.replace(/\*\*/g, '');
                text = text.replace(/#+/g, '\n\n');
                text = text.replace(/(\d+)\.\s+(.+)/g, '\n$1、$2\n\n');
                text = text.replace(/^[\s\uFEFF\xA0]*-/gm, '-')
                    .replace(/^(-.*)/gm, '$1\n');
                text = text.replace(/(\n\s*){2,}/g, '\n\n');
                text = removeTrailingEmptyLines(text);
                editor.value = text;
                reformatText(false);
                scrollTop();
            }

            // ---------- 清空 ----------
            function clear() {
                if (confirm('确定要清空吗？')) {
                    saveState();
                    editor.value = '';
                    localStorage.removeItem(currentUrl);
                    updateReadTime();
                    location.reload(true);
                }
            }

            // ---------- 序号切换（只使用普通数字，避免乱码） ----------
            function xhText() {
                saveState();
                let text = editor.value;

                // 只检测普通数字 0-9，忽略粗体字符（因为它们可能导致乱码）
                function isNormalDigit(ch) {
                    return ch >= '0' && ch <= '9';
                }

                function processLine(line) {
                    // 保留行首空白
                    const leading = line.match(/^[ \t]*/)[0];
                    const rest = line.substring(leading.length);
                    if (rest.length === 0) return line;

                    // 第一个字符必须是普通数字
                    if (!isNormalDigit(rest[0])) return line;

                    // 提取连续的数字序列（最多3位）
                    let numSeq = '';
                    for (let i = 0; i < rest.length && i < 3; i++) {
                        if (isNormalDigit(rest[i])) {
                            numSeq += rest[i];
                        } else {
                            break;
                        }
                    }
                    if (numSeq.length === 0) return line;

                    // 检查分隔符：顿号或空格
                    const nextIdx = numSeq.length;
                    if (nextIdx >= rest.length) return line;
                    const delimiter = rest[nextIdx];
                    if (delimiter !== '、' && delimiter !== ' ') return line;

                    // 后续内容
                    const after = rest.substring(nextIdx + 1);

                    // 计算数值
                    const value = parseInt(numSeq, 10);
                    if (isNaN(value)) return line;

                    // 判断当前是否为三位且首位是0（前导零）
                    const isThree = numSeq.length === 3;
                    const hasLeadingZero = (numSeq[0] === '0');

                    let targetNum, targetDelimiter;
                    if (isThree && hasLeadingZero) {
                        // 三位补零 -> 去掉前导零，用顿号
                        targetNum = value.toString();
                        targetDelimiter = '、';
                    } else {
                        // 无前导零 -> 补零三位，用空格
                        targetNum = value.toString().padStart(3, '0');
                        targetDelimiter = ' ';
                    }

                    return leading + targetNum + targetDelimiter + after;
                }

                const lines = text.split('\n');
                let hasChanged = false;
                const newLines = lines.map(line => {
                    const processed = processLine(line);
                    if (processed !== line) hasChanged = true;
                    return processed;
                });

                if (!hasChanged) {
                    showAutoCloseAlert("未找到行首序号格式（如 1、 或 001 ）");
                    return;
                }

                editor.value = newLines.join('\n');
                updateReadTime();
                saveText();
                showAutoCloseAlert("序号切换成功");
            }

            // ---------- 自定义提示 ----------
            function showAutoCloseAlert(message) {
                const alert = document.createElement('div');
                alert.style.position = 'fixed';
                alert.style.bottom = '0.1%';
                alert.style.left = '50%';
                alert.style.transform = 'translate(-50%, -50%)';
                alert.style.padding = '20px 30px';
                alert.style.backgroundColor = 'rgba(255, 255, 255, 0.7)';
                alert.style.backdropFilter = 'blur(10px)';
                alert.style.border = '1px solid rgba(200, 200, 200, 0.5)';
                alert.style.borderRadius = '8px';
                alert.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.1)';
                alert.style.zIndex = '9999';
                alert.style.color = 'black';
                alert.style.fontSize = '16px';
                alert.textContent = message;
                document.body.appendChild(alert);
                setTimeout(() => {
                    alert.remove();
                }, 800);
            }

            // ---------- 事件绑定 ----------
            scrollTopButton.addEventListener('click', scrollTop);
            numBigButton.addEventListener('click', numBig);
            copyButton.addEventListener('click', copy);
            xhButton.addEventListener('click', xhText);
            cleanMarkdownButton.addEventListener('click', cleanMarkdown);
            clearButton.addEventListener('click', clear);

            editor.addEventListener('input', updateReadTime);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' && document.activeElement !== editor) {
                    clear();
                }
            });
        });
    </script>
</body>

</html>
